{% load static %}
<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}学习资料工作台{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'web/app.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'web:index' %}">学习资料工作台</a>
    {% if request.user.is_authenticated %}
      <form method="post" action="/accounts/logout/" class="logout-form">
        {% csrf_token %}<button type="submit" class="quiet-button">退出</button>
      </form>
    {% endif %}
  </header>
  <main class="page-shell">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">仅限已授权的家庭成员访问。</footer>
  {% block scripts %}{% endblock %}
</body>
</html>
