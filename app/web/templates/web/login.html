{% extends "web/base.html" %}
{% block title %}登录 · 学习资料工作台{% endblock %}
{% block content %}
  <section class="panel narrow-panel">
    <h1>登录</h1>
    <p class="muted">登录后查看已授权的资料集。</p>
    {% if form.errors %}<p class="notice error" role="alert">用户名或密码不正确。</p>{% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="field"><label for="id_username">用户名</label>{{ form.username }}</div>
      <div class="field"><label for="id_password">密码</label>{{ form.password }}</div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit" class="primary-button">登录</button>
    </form>
  </section>
{% endblock %}
